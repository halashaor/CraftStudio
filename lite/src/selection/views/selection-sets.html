<summary>常用选择</summary>
<label
  >已保存<select id="selection-set-list">
    <option value="">选择记录</option>
  </select></label
>
<label>名称<input id="selection-set-name" placeholder="例如：木屋全部窗框" /></label>
<div class="row">
  <button id="selection-set-save">保存当前选择</button
  ><button id="selection-set-update">更新记录</button>
</div>
<div class="row">
  <button id="selection-set-restore">恢复选择</button
  ><button id="selection-set-remove">移除记录</button>
</div>
<p id="selection-set-report" class="small">
  对象引用跟随位置变化；自由方块区域保留固定坐标。移除记录不删除模型。
</p>
