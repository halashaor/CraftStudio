<div class="scene-browser-filters">
  <label
    >浏览集合<select id="cad-collection-filter">
      <option value="">全部对象与草图</option>
    </select></label
  >
  <label class="check"
    ><input type="checkbox" id="cad-object-attention" />只看需要处理
    <small id="cad-object-attention-count"></small
  ></label>
</div>
<details id="cad-object-filter-details">
  <summary>筛选对象类型与状态</summary>
  <label
    >对象类型<select id="cad-object-kind">
      <option value="">所有类型</option>
    </select></label
  >
  <label
    >对象状态<select id="cad-object-state">
      <option value="">所有状态</option>
      <option value="visible">可见对象</option>
      <option value="hidden">隐藏对象</option>
      <option value="locked">锁定对象</option>
    </select></label
  >
  <p class="small">
    对象过滤会保留相关草图作为参照。隐藏对象可列出查看，但不加入结果选择；锁定对象仍可选中检查。
  </p>
</details>
<button
  id="cad-select-filtered"
  class="full"
  title="只选择筛选结果中的可见对象；Shift 增加，Ctrl 减去"
>
  选中筛选结果
</button>
<details id="cad-collections">
  <summary>管理集合</summary>
  <label>集合名称<input id="cad-collection-name" placeholder="例如：主馆、庭院、设备层" /></label>
  <div class="row">
    <button id="cad-collection-create">新建</button><button id="cad-collection-rename">改名</button>
  </div>
  <div class="row">
    <button id="cad-collection-assign">选中对象归入</button
    ><button id="cad-collection-select">选择可见成员</button>
  </div>
  <div class="row"><button id="cad-collection-unassign">选中对象移出</button></div>
  <div class="row">
    <button id="cad-collection-hide">隐藏集合</button
    ><button id="cad-collection-lock">锁定集合</button
    ><button id="cad-collection-remove">解除集合</button>
  </div>
  <p class="small">
    集合用于组织对象；解除集合不删除方块。隐藏集合保留成员自己的隐藏状态；锁定集合保护成员方块，仍可选择、测量和导出。
  </p>
</details>
