<div class="dialog-header">
  <h2>资源库 · 基础素材设置</h2>
  <button id="resource-library-close">关闭</button>
</div>
<div class="cad-dialog-body">
  <p class="muted">
    原版和 Create 设置一次，之后工程自动复用。资源按列表从上到下加载，后面的材质包覆盖前面的外观。
  </p>
  <div class="row">
    <button id="resource-library-local">从本地实例设置基础素材</button
    ><button id="resource-library-files">添加 JAR / ZIP 文件</button>
  </div>
  <p id="resource-library-status" class="small"></p>
  <div id="resource-library-rows"></div>
  <p class="small">
    资源仅保存在本机。工程仍会保存使用到的模型与贴图；完整资源库随工程库备份转移。
  </p>
</div>
