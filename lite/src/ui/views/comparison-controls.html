<div class="comparison-records">
  <div>
    <button id="studio-a">记录当前为 A</button><small data-comparison-record="a">尚未记录</small>
  </div>
  <div>
    <button id="studio-b">记录当前为 B</button><small data-comparison-record="b">尚未记录</small>
  </div>
</div>
<div class="comparison-choices" role="group" aria-label="同视角比较方案">
  <button id="studio-show-current" data-comparison-show="current">当前设计</button>
  <button id="studio-show-a" data-comparison-show="a" disabled>查看 A</button>
  <button id="studio-show-b" data-comparison-show="b" disabled>查看 B</button>
  <button data-comparison-show="history" hidden>历史版本</button>
</div>
<p class="small">
  A/B
  用于本次会话的三维对比，不替换当前设计。切换工程或关闭后清空；需长期保留的方案请分别保存正式版本。
</p>
