<div id="sketch-context" class="visual-context" aria-live="polite">

      <circle cx="10" cy="28" r="3" />
      <rect x="21" y="2" width="6" height="6" />
      <rect x="45" y="32" width="6" height="6" />
      <circle cx="61" cy="13" r="3" />
    </g>
    <g class="context-blocks">
      <rect x="12" y="23" width="10" height="10" />
      <rect x="22" y="18" width="10" height="10" />

      <rect x="42" y="15" width="10" height="10" />
      <rect x="52" y="10" width="10" height="10" />
