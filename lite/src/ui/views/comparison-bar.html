<div class="comparison-summary">
  <strong data-comparison-status></strong>
  <small data-comparison-detail>只读对比 · 相机可自由移动</small>
</div>
<div class="comparison-choices" role="group" aria-label="切换对比方案">
  <button data-comparison-show="a">A</button><button data-comparison-show="b">B</button>
  <button data-comparison-show="history" hidden>历史版本</button>
  <button data-comparison-branch hidden>从此版本新建方案</button>
  <button data-comparison-show="current" class="primary">返回当前设计 · Esc</button>
</div>
