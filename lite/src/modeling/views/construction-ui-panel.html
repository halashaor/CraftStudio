<div class="construction-header">
  <strong id="construction-title">图形与曲线</strong
  ><button id="construction-frame" title="让当前轮廓完整显示在视口中">定位</button
  ><button id="construction-close">×</button>
</div>
<section id="figure-controls">
  <label
    >图形<select id="figure-kind">
      <option value="bezier">贝塞尔曲线</option>
      <option value="spline">贯穿点曲线</option>
      <option value="line">直线</option>
      <option value="polyline">连续折线</option>
      <option value="rectangle">矩形</option>
      <option value="circle">圆</option>
      <option value="ellipse">椭圆</option>
      <option value="arc">圆弧</option>
      <option value="polygon">多边形</option>
      <option value="box">长方体</option>
    </select></label
  >
  <div class="row">
    <label
      >工作平面<select id="figure-plane">
        <option value="xz">水平 XZ</option>
        <option value="xy">立面 XY</option>
        <option value="yz">立面 YZ</option>
        <option value="custom" disabled>自定义平面</option>
      </select></label
    ><label>线宽（格）<input id="figure-width" type="number" value="1" min="1" max="16" /></label>
  </div>
  <div class="row">
    <button id="sketch-face-plane">选取面</button><button id="sketch-three-plane">三点建面</button
    ><button id="sketch-face-view">正对平面</button>
  </div>
  <label class="check"
    ><input id="sketch-pick-surface" type="checkbox" checked />曲线路径按鼠标所指表面取点</label
  >
  <p id="sketch-plane-status" class="small">世界平面；可从现有面或三个位置设置。</p>
  <label class="check"><input id="figure-fill" type="checkbox" />填充闭合图形 / 体积</label
  ><label class="check"
    ><input id="figure-guides-only" type="checkbox" checked />只保存辅助轮廓，不放置方块</label
  >
  <details class="sketch-settings">
    <summary>工作平面、吸附与尺寸约束</summary>
    <label
      >吸附<select id="sketch-snap">
        <option value="0.5">半格（兼容半砖）</option>
        <option value="1">整格</option>
        <option value="0">自由辅助几何</option>
      </select></label
    ><label class="check"
      ><input id="sketch-plane-lock" type="checkbox" />锁定控制点到工作平面</label
    ><label class="check"
      ><input id="sketch-geometry-snap" type="checkbox" checked /><span
        id="sketch-geometry-snap-label"
        >吸附已有轮廓的端点 / 中心</span
      ></label
    ><label
      >约束<select id="sketch-constraint">
        <option value="free">自由</option>
        <option value="horizontal">水平直线</option>
        <option value="vertical">竖直直线</option>
        <option value="parallel">与参考线平行</option>
        <option value="perpendicular">与参考线垂直</option>
        <option value="symmetric">四点曲线对称</option>
      </select></label
    ><label>参考线<select id="sketch-reference"></select></label>
    <div id="sketch-size-fields" class="row">
      <label>长度 / 宽度<input id="sketch-length" type="number" min="0.5" step="0.5" /></label
      ><label id="sketch-height-label"
        >高度 / 深度<input id="sketch-height" type="number" min="0.5" step="0.5"
      /></label>
    </div>
    <p id="sketch-dimensions" class="small"></p>
  </details>
  <label id="sketch-axis-label" hidden
    >控制点移动方向<select id="sketch-axis">
      <option value="free">自由</option>
      <option value="X">X</option>
      <option value="Y">Y</option>
      <option value="Z">Z</option>
      <option value="XY">XY 平面</option>
      <option value="XZ">XZ 平面</option>
      <option value="YZ">YZ 平面</option></select
    ><span id="sketch-axis-status" class="small"></span
  ></label>
  <div id="figure-points"></div>
  <div class="row">
    <button id="figure-pick">重新绘制</button
    ><button id="figure-back" hidden title="绘制过程中撤回最近的取点；Backspace 或 Ctrl+Z">
      退回上一点</button
    ><button id="figure-add">添加控制点</button>
  </div>
  <div id="sketch-node-tools">
    <button id="sketch-bezier-elevate" hidden>增阶保持曲线形状</button>
    <p id="sketch-node-status" class="small"></p>
    <div class="row">
      <button id="sketch-node-insert">选中点后插入</button
      ><button id="sketch-node-remove">删除选中点</button>
    </div>
  </div>
  <div id="polyline-actions" class="row" hidden>
    <button id="polyline-finish">完成开放路径</button><button id="polyline-close">闭合路径</button>
  </div>
  <label
    >落格方式<select id="figure-voxel">
      <option value="smart">自动：方块 / 半砖 / 楼梯</option>
      <option value="cube">纯方块</option>
      <option value="slab">半砖优先</option>
      <option value="stairs">楼梯优先</option>
    </select></label
  ><label
    >对齐曲线<select id="figure-surface">
      <option value="top">上表面（路面 / 屋面）</option>
      <option value="bottom">下表面（拱腹 / 檐口）</option>
    </select></label
  ><button id="figure-material">主体：当前素材</button>
  <div class="row">
    <button id="figure-slab">指定半砖</button><button id="figure-stairs">指定楼梯</button>
  </div>
  <label
    >适应地形<select id="figure-terrain">
      <option value="none">自由高度</option>
      <option value="surface">沿真实地面贴合</option>
      <option value="supports">保留地形，自动落地支撑</option>
      <option value="grade">沿设计高度挖填成路</option>
    </select></label
  >
  <div class="row">
    <label>贴地高度偏移<input id="figure-offset" type="number" value="0" step="0.5" /></label
    ><label>支撑间距<input id="figure-spacing" type="number" value="4" min="1" /></label>
  </div>
</section>
<section id="feature-controls" hidden>
  <p class="small">
    首尾相接、同一平面的线段会自动组成闭合截面。拉伸选一个截面，放样选择多个截面。
  </p>
  <label
    >操作<select id="feature-operation">
      <option value="extrude">拉伸</option>
      <option value="loft">多截面放样</option>
      <option value="sweep">沿路径生成</option>
    </select></label
  ><label>截面（Ctrl / Shift 多选）<select id="feature-profiles" multiple size="4"></select></label
  ><label id="feature-sweep-mode-label"
    >扫掠截面<select id="feature-sweep-mode">
      <option value="profile">自绘闭合截面</option>
      <option value="rectangle">快速矩形</option>
      <option value="rectangle-fit">精确矩形 · 半格截面</option>
    </select></label
  ><label id="feature-placement-label"
    >截面位置<select id="feature-profile-placement">
      <option value="asDrawn">保留绘制偏移</option>
      <option value="center">居中到路径</option>
    </select></label
  ><label id="feature-seam-mode-label"
    >截面起点匹配<select id="feature-seam-mode">
      <option value="auto">自动对齐</option>
      <option value="manual">手动调整</option>
    </select></label
  >
  <div id="feature-seam-controls" hidden></div>
  <label class="check"
    ><input id="feature-close-frame" type="checkbox" checked />闭合轨道首尾方向对齐</label
  >
  <p id="feature-seam-hint" class="small" hidden>
    橙点表示轮廓起点；闭合方向校正不自动修复自交或不同首尾形状。
  </p>
  <label
    >远处片段重叠<select id="feature-overlap">
      <option value="merge">合并相交体积</option>
      <option value="stop">出现重叠时停止确认</option>
    </select></label
  ><button id="feature-overlap-focus" hidden>定位重叠位置</button
  ><label>路径<select id="feature-path"></select></label
  ><label
    >工作平面<select id="feature-plane">
      <option value="auto">自动 · 沿截面法线</option>
      <option value="xz">水平 XZ</option>
      <option value="xy">立面 XY</option>
      <option value="yz">立面 YZ</option>
    </select></label
  ><label>拉伸距离（格，可负值）<input id="feature-depth" type="number" value="8" step="1" /></label
  ><label class="check"><input id="feature-symmetric" type="checkbox" />双向对称拉伸</label
  ><label class="check"><input id="feature-smooth" type="checkbox" />截面过渡平滑</label>
  <div class="row">
    <label>路径宽度<input id="feature-width" type="number" value="3" min="1" max="64" /></label
    ><label>路径高度<input id="feature-height" type="number" value="3" min="1" max="64" /></label>
  </div>
  <label class="check"><input id="feature-hollow" type="checkbox" />空心</label
  ><label
    >壁厚<input
      id="feature-thickness"
      type="number"
      value="1"
      min="0.5"
      max="64"
      step="0.5" /></label
  ><label class="check"><input id="feature-caps" type="checkbox" checked />封闭两端</label
  ><label class="check"><input id="feature-cut" type="checkbox" />切除已有方块</label
  ><button id="feature-material">主体：当前素材</button
  ><label
    >扫掠边界<select id="feature-voxel">
      <option value="cube">纯方块</option>
      <option value="smart">拟合半砖 / 楼梯</option>
    </select></label
  >
  <div id="feature-variant-roles" class="row" hidden>
    <button id="feature-slab">指定半砖</button><button id="feature-stairs">指定楼梯</button>
  </div>
</section>
<section id="terrain-controls" hidden>
  <p class="small">使用当前选区的 XZ 范围。建筑、植被阻挡处和水面保留；挖填结果先预览。</p>
  <label
    >处理方式<select id="terrain-operation">
      <option value="flatten">局部整平</option>
      <option value="smooth">柔和平滑</option>
      <option value="slope">生成连续坡面</option>
    </select></label
  ><button id="terrain-draw-slope">拖动绘制坡道</button>
  <section id="terrain-endpoints" hidden>
    <div class="row">
      <label
        >起点地面层<input id="terrain-start-y" type="number" min="0" max="4094" step="1" /></label
      ><label
        >终点地面层<input id="terrain-end-y" type="number" min="0" max="4094" step="1"
      /></label>
    </div>
  </section>
  <p id="terrain-slope-readout" class="small" hidden></p>
  <button id="terrain-pick-height">从场景取目标标高</button
  ><label
    >目标地面 Y（方块层）<input id="terrain-height" type="number" value="0" min="0" max="4094"
  /></label>
  <div class="row">
    <label>X 方向坡度<input id="terrain-slope-x" type="number" value="0" step="0.1" /></label
    ><label>Z 方向坡度<input id="terrain-slope-z" type="number" value="0" step="0.1" /></label>
  </div>
  <label>平滑半径<input id="terrain-radius" type="number" value="1" min="1" max="4" /></label
  ><button id="terrain-material">填方：泥土</button>
</section>
<hr />
<div class="row">
  <label class="check"><input id="construction-lines" type="checkbox" checked />辅助线</label
  ><label class="check"
    ><input id="construction-blocks" type="checkbox" checked />实际方块预览</label
  >
</div>
<p id="construction-report" class="small">拖动控制点，或在场景取点。</p>
<div class="row">
  <button id="construction-preview">更新预览</button
  ><button id="construction-apply" class="primary">确认放置</button>
</div>
<p class="small">辅助线不会导出为方块。确认后可一次撤销。</p>
