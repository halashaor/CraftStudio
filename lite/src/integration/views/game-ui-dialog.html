<div class="dialog-header">
  <h2>连接 Java 游戏</h2>
  <button id="game-close">关闭</button>
</div>
<div class="cad-dialog-body">
  <p class="muted">
    安装与游戏版本、加载器对应的 CraftStudio Bridge，打开世界后连接。Fabric 还需 Fabric
    API。蓝图文件导入导出仍可独立使用。
  </p>
  <label>桥接令牌<input id="game-token" type="password" autocomplete="off" /></label
  ><label
    >或选择 config/craftstudio-token.txt<input
      id="game-token-file"
      type="file"
      accept=".txt" /></label
  ><label>本机端口<input id="game-port" type="number" value="18766" /></label
  ><button id="game-connect">连接并识别版本</button>
  <p id="game-health" class="small"></p>
  <label
    >维度<select id="game-dimension">
      <option value="minecraft:overworld">主世界</option>
    </select></label
  >
  <div class="triple">
    <label>场地原点 X<input id="game-x" type="number" value="0" /></label
    ><label>场地原点 Y<input id="game-y" type="number" value="64" /></label
    ><label>场地原点 Z<input id="game-z" type="number" value="0" /></label>
  </div>
  <p class="small">施工改动保持相对于场地原点的位置；改动选区裁切不会改变世界坐标。</p>
  <details>
    <summary>读取区域尺寸</summary>
    <div class="triple">
      <label>宽<input id="game-width" type="number" min="1" value="32" /></label
      ><label>高<input id="game-height" type="number" min="1" value="32" /></label
      ><label>深<input id="game-length" type="number" min="1" value="32" /></label>
    </div>
    <button id="game-read">读取游戏选区</button>
  </details>
  <hr />
  <label
    >施工范围<select id="game-scope">
      <option value="additions">本次新增与替换</option>
      <option value="patch">全部改动（含拆除）</option>
      <option value="selection">当前选中的建筑 / 区域</option>
      <option value="full">完整场景（包含原地形）</option>
    </select></label
  ><label class="check"><input id="game-overwrite" type="checkbox" />允许替换目标已有方块</label>
  <div class="row">
    <button id="game-validate">准备并检查施工</button
    ><button id="game-build" class="primary">确认建造</button>
  </div>
  <p id="game-prepared" class="small">先准备施工内容，检查实际世界范围后确认建造。</p>
  <div class="row">
    <button id="game-job">刷新施工进度</button><button id="game-cancel">停止当前施工</button
    ><button id="game-undo">撤销上次施工</button>
  </div>
  <p id="game-report" class="small"></p>
  <p class="small">
    施工前生成备份，按游戏 tick 分批放置。停止后保留已放置部分，可撤销。原生实体、跨版本机器 NBT
    使用原生蓝图流程，不会静默丢弃。
  </p>
</div>
