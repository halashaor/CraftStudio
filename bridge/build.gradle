plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.1.0'
group = 'local.craftstudio'
base { archivesName = 'craftstudio-bridge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
