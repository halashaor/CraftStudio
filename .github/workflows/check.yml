name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
        working-directory: lite
      - run: npm test
        working-directory: lite
      - run: npm run build
        working-directory: lite
      - run: python -m unittest discover -s tests -p "test_*.py"
